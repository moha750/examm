<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار مادة الدعاية</title>
<meta name="description" content="اختبار تفاعلي شامل لمقرر الدعاية — المحاضرات 2 إلى 6، مع تفسير لكل إجابة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --ok:#1e7a46; --ok-soft:#e2f3e8; --bad:#b33a2b; --bad-soft:#f8e3df;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --card:#1f1e1c; --ink:#efece6; --muted:#a39d92; --line:#34322e;
    --accent:#6fb0de; --accent-soft:#1d2f3d;
    --ok:#5cc38a; --ok-soft:#173226; --bad:#ec7b6b; --bad-soft:#3a1f1b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1f1e1c; --ink:#efece6; --muted:#a39d92; --line:#34322e;
  --accent:#6fb0de; --accent-soft:#1d2f3d;
  --ok:#5cc38a; --ok-soft:#173226; --bad:#ec7b6b; --bad-soft:#3a1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-weight:700;font-size:1.15rem}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
h1{font-size:1.6rem;margin:0 0 6px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 20px}
.label{font-weight:600;font-size:.9rem;margin:18px 0 8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{color:var(--muted);font-size:.85rem;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 10px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.exp{margin-top:16px;border-radius:12px;padding:14px 16px;border-inline-start:4px solid}
.exp.ok{background:var(--ok-soft);border-color:var(--ok)}
.exp.bad{background:var(--bad-soft);border-color:var(--bad)}
.exp b{display:block;margin-bottom:4px}
.score{font-size:3rem;font-weight:700;color:var(--accent);line-height:1.2}
.review{margin-top:22px;display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .ra{color:var(--ok);font-weight:600}
.rv .re{color:var(--muted);font-size:.92rem;margin-top:4px}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.resume{margin-bottom:16px;border-color:var(--accent)}
.resume .lead{margin:4px 0 0}
.hint{color:var(--muted);font-size:.8rem;margin-top:14px;text-align:center}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
@media (max-width:480px){.card{padding:18px}.q{font-size:1.08rem}h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">اختبار مادة الدعاية<small>المحاضرات 2 – 6</small></div>
    <button class="icon-btn" id="theme" type="button">الوضع</button>
  </header>
  <main id="app"></main>
  <footer>كل الأسئلة مبنية على شرائح المقرر<br>برمجة وتطوير: <strong>محمد إسماعيل المطر</strong></footer>
</div>

<script>
// [lecture, question, options[], correctIndex, explanation, keepOrder?]
const TF=["صح","خطأ"];
const Q=[
// ===== المحاضرة 2: مفهوم الدعاية =====
[2,"لماذا يصعب التوصل إلى تعريف دقيق وموحّد للدعاية؟",["عدم الاتفاق على معايير تميزها عن المفاهيم القريبة، والدلالات السلبية المرتبطة بها","حداثة المصطلح","قلة الباحثين في المجال","ارتباطها بالتسويق فقط"],0,"لم يتفق الباحثون على معايير تميز الدعاية عن الإعلام والتعليم والإعلان، كما زادت دلالاتها السلبية (الكذب والتلاعب) من صعوبة تعريفها."],
[2,"من المفاهيم القريبة من الدعاية التي يصعب التمييز بينها وبينها:",["الإعلام والتعليم والإعلان","الاقتصاد والسياسة","الفلسفة والمنطق","التاريخ والجغرافيا"],0,"لم يتفق الباحثون على معايير تميّز الدعاية عن الإعلام والتعليم والإعلان."],
[2,"كلمة «دعاية» في أصلها اللاتيني مشتقة من:",["Propacatus","Propaganda","Publicity","Persuasio"],0,"الأصل اللاتيني Propacatus ومعناها «يُبذر أو يُنشر»، أما Propaganda فهي الكلمة الإنجليزية."],
[2,"معنى الأصل اللاتيني لكلمة الدعاية:",["يُبذر أو يُنشر","يُقنع","يُخدع","يُعلن"],0,"Propacatus تعني «يُبذر أو يُنشر»."],
[2,"الكلمة الإنجليزية المقابلة للدعاية:",["Propaganda","Propacatus","Advertising","Information"],0,"في الإنجليزية Propaganda."],
[2,"عرّف معجم أوكسفورد الدعاية بأنها:",["وسيلة أو حركة منسقة تهدف إلى نشر مبدأ معين أو الدفع إلى ممارسة أفعال محددة","أداة تحمل الأكاذيب والخداع","ترويج مستتر لرسائل","تبادل منظم للعنف"],0,"تعريف معجم أوكسفورد: وسيلة أو حركة منسقة لنشر وبث مبدأ معين، أو الدفع لممارسة أفعال محددة."],
[2,"كلمة «دعاية» في اللغة العربية مشتقة من الفعل:",["دعا، يدعو","ادّعى","دعم","وعى"],0,"مشتقة من الفعل «دعا، يدعو، دعايةً»."],
[2,"«الدِّعاية» في أصلها العربي هي:",["الدعوة إلى رأي بالكتابة أو الخطابة ونحوهما","الترغيب في شيء","الكذب والخداع","الإعلان التجاري"],0,"الدِّعاية: الدعوة إلى رأي بالكتابة أو الخطابة. أما «الدعوة» إلى شيء فهي الترغيب فيه."],
[2,"الدعوة إلى شيء في اللغة تعني:",["الترغيب فيه","التحذير منه","الإعلان عنه","إخفاؤه"],0,"«الدعوة» إلى شيء هي الترغيب فيه."],
[2,"عرّف الدعاية على أنها ترويج مستتر أو خفي لرسائل تخفي عن الجمهور مصدرها وأهدافها وأساليبها ومضمونها ونتائجها:",["لملي (Lumley)","وليتر (Walter)","وريفورد","جوبلز"],0,"لملي (Lumley) عام 1929."],
[2,"في أي عام قدّم لملي تعريفه للدعاية؟",["1929","1923","1914","1622"],0,"لملي 1929، ووريفورد 1923."],
[2,"عدد العوامل التي يرى لملي أن إخفاء أحدها يجعل النشاط دعاية:",["خمسة","ثلاثة","أربعة","ستة"],0,"العوامل الخمسة: المصدر، الأهداف، الأساليب، المضمون، النتائج."],
[2,"حسب لملي يصبح السلوك دعاية إذا:",["تم إخفاء عامل واحد أو أكثر من العوامل الخمسة","أُخفيت جميع العوامل فقط","كان صادقًا","كان مدفوع الأجر"],0,"يكفي إخفاء عامل واحد أو أكثر من العوامل الخمسة."],
[2,"أيّ مما يلي ليس من العوامل الخمسة عند لملي؟",["الوسيلة","المصدر","الأهداف","النتائج"],0,"العوامل: المصدر، الأهداف، الأساليب، المضمون، النتائج."],
[2,"«محاولة التأثير في الأفراد والجماهير للسيطرة على سلوكهم لأغراض مشكوك في صحتها» تعريف:",["وليتر (Walter)","لملي","وريفورد","تشومسكي"],0,"مفتاح وليتر: «أغراض مشكوك في صحتها»."],
[2,"من فرّق بين الدعاية «الشريرة» و«العادية»؟",["وريفورد","لملي","وليتر","أحمد بدر"],0,"وريفورد عام 1923: الدعاية نشر معلومات وآراء لتحقيق هدف أو مصلحة، وفرق بين الشريرة والعادية."],
[2,"عرّف الدعاية بأنها أساليب اتصال مباشرة وغير مباشرة، أخلاقية أو غير أخلاقية، معلومة أو مجهولة المصدر:",["محمد كمال القاضي","سمير محمد حسين","محمد منير حجاب","شاهيناز طلعت"],0,"تعريف محمد كمال القاضي من الباحثين العرب."],
[2,"يتفق بعض الباحثين على أن الدعاية فن يعتمد على:",["الرموز والكلمات والموسيقى والإشارات","الأرقام فقط","القوة العسكرية","القوانين"],0,"الدعاية فن يعتمد على الرموز والكلمات والموسيقى والإشارات لزيادة قدرتها على التأثير."],
[2,"تتميز الدعاية بوصفها فنًا بـ:",["الانتقاء المحسوب للرموز وترويجها للتأثير على السلوك الجماهيري","العشوائية","الحياد التام","الصدق الدائم"],0,"تتميز بالانتقاء المحسوب للرموز وترويجها."],
[2,"عرّفت الدعاية بأنها عملية تعتمد على الرموز والإشارات والموسيقى والصور والكلمات للتأثير على القيم والمعتقدات:",["دائرة المعارف الدولية للعلوم الاجتماعية","معجم أوكسفورد","معهد تحليل الدعاية","تقرير ماكبرايد"],0,"دائرة المعارف الدولية للعلوم الاجتماعية."],
[2,"يرى أن البعض لا يرى عيبًا في كلمة الدعاية لأنها قد تستخدم لأغراض طيبة أو خبيثة:",["أحمد بدر","جوبلز","تشومسكي","وليتر"],0,"أحمد بدر."],
[2,"عرّف الدعاية بأنها أداة تحمل في داخلها الأكاذيب والخداع:",["جوبلز","أحمد بدر","وريفورد","لملي"],0,"جوبلز."],
[2,"صاحب مصطلح «تصنيع إجماع عام»:",["نعوم تشومسكي","فيليب تايلور","جوبلز","لاسويل"],0,"تشومسكي: الدعاية تحمل جانبًا واحدًا من الحقيقة وتعمل على «تصنيع إجماع عام»."],
[2,"يرى تشومسكي أن الدعاية تحمل:",["جانبًا واحدًا فقط من جوانب الحقيقة","الحقيقة كاملة","الكذب المطلق فقط","معلومات علمية"],0,"تحمل جانبًا واحدًا فقط من جوانب الحقيقة."],
[2,"استدل تشومسكي على قوة الدعاية الخادعة من خلال:",["الخطاب السياسي الدعائي الأمريكي","الدعاية النازية","الدعاية السوفيتية","الإعلان التجاري"],0,"استدل بالخطاب السياسي الدعائي الأمريكي."],
[2,"من منظور دراسات التسويق تعد الدعاية أحد مكونات:",["المزيج الترويجي","المزيج الإعلامي","الحرب النفسية","العلاقات الدولية"],0,"الدعاية أحد مكونات المزيج الترويجي."],
[2,"عناصر المزيج الترويجي:",["الإعلان، البيع الشخصي، ترويج المبيعات، العلاقات العامة، الدعاية","الإعلام، التعليم، الإعلان","المنتج، السعر، المكان","الدفاعية، الهجومية، الانقسامية"],0,"المزيج الترويجي خمسة عناصر."],
[2,"في التسويق تُعرَّف الدعاية بأنها الوسيلة ... لتقديم السلع والخدمات بواسطة جهة معلومة:",["غير الشخصية والمجانية","الشخصية المدفوعة","السرية","المباشرة المدفوعة"],0,"الدعاية تسويقيًا: الوسيلة غير الشخصية والمجانية بواسطة جهة معلومة."],
[2,"تعرف الدعاية تسويقيًا أيضًا بأنها ذلك الجزء من:",["العلاقات العامة الموجه غالبًا لترويج سلعة أو خدمة للمشروع","البيع الشخصي","الحرب النفسية","الإعلام الرسمي"],0,"ذلك الجزء من العلاقات العامة الموجه لترويج سلعة أو خدمة."],
[2,"من أشكال الدعاية في مجال التسويق:",["خبر قصير، أو مقالة مطولة، أو صورة فوتوغرافية مع مقالة","الأناشيد الوطنية فقط","المواكب الرسمية","الإشاعات"],0,"قد تقتصر على خبر قصير، أو مقالة مطولة، أو صورة فوتوغرافية مع المقالة."],
[2,"يرى فيليب تايلور أن الحرب في جوهرها:",["تبادل منظم للعنف","إقناع منظم","حرب كلمات","عملية تسويقية"],0,"الحرب تبادل منظم للعنف، والدعاية إقناع منظم."],
[2,"يرى فيليب تايلور أن الدعاية في جوهرها:",["إقناع منظم","تبادل منظم للعنف","كذب منظم","إعلام محايد"],0,"الدعاية في جوهرها إقناع منظم."],
[2,"حسب تايلور (المحاضرة 2)، الحرب تهاجم ... بينما الدعاية تنقض على ...:",["الجسد / العقل","العقل / الجسد","القلب / العقل","الاقتصاد / السياسة"],0,"الأولى (الحرب) تهاجم الجسد، والثانية (الدعاية) تنقض على العقل."],
[2,"اعتمدت على الدعاية بصورة رئيسية في الداخل والخارج في الخمسينيات:",["إدارة أيزنهاور","إدارة روزفلت","حكومة هتلر","الاتحاد السوفيتي"],0,"إدارة أيزنهاور في فترة الخمسينيات."],
[2,"توصف الدعاية بأنها سلاح رئيسي من أسلحة الحروب لكنها:",["سلاح آمن يُستخدم بسلام","سلاح مدمر","سلاح محرم","سلاح غير فعال"],0,"الدعاية سلاح رئيسي من أسلحة الحروب لكنها سلاح آمن يستخدم بسلام."],
[2,"الحرب النفسية هي:",["استخدام الدعاية ضد العدو مع عمليات عسكرية أو إجراءات أخرى لتكملتها","الإعلان التجاري","الدعاية البيضاء","التعليم العسكري"],0,"تعريف الحرب النفسية في الشرائح."],
[2,"من المصطلحات التي ظهرت بين مصطلحي الدعاية والحرب النفسية:",["حرب الكلمات، حرب الأفكار، حرب الأعصاب","المزيج الترويجي","الإعلام الجديد","التسويق الاجتماعي"],0,"ظهرت مصطلحات: حرب الكلمات، وحرب الأفكار، وحرب الأعصاب."],
[2,"عرّف الدعاية بأنها التعبير عن الرأي أو العمل للوصول إلى غايات محددة بواسطة مناورات سيكولوجية:",["معهد تحليل الدعاية بالولايات المتحدة","دائرة المعارف الدولية","معجم أوكسفورد","فيليب تايلور"],0,"معهد تحليل الدعاية بالولايات المتحدة الأمريكية."],
[2,"أيّ مما يلي ليس من أسباب تعدد تعريفات الدعاية؟",["اختلاف اللغات التي كُتبت بها","الفترة الزمنية التي عُرفت فيها","تخصص من عرّفها","طبيعة النظم القائمة"],0,"الأسباب: الفترة الزمنية، التخصص، طبيعة النظم القائمة، نظرة الأشخاص للجماهير."],

const LECT={2:"مفهوم الدعاية",3:"نشأة وتطور الدعاية",4:"أنواع الدعاية (1)",5:"تصنيف الدعاية (2)",6:"أساليب الدعاية"}
const KEYS=Object.keys(LECT).map(Number);
const app=document.getElementById("app");
const LETTERS=["أ","ب","ج","د"];
let sel=new Set(KEYS), count="all", S=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function prep(raw){
  const [l,q,o,a,e,keep]=raw;
  if(keep) return {l,q,o:o.slice(),a,e};
  const idx=shuffle(o.map((_,i)=>i));
  return {l,q,o:idx.map(i=>o[i]),a:idx.indexOf(a),e};
}

const KEY="pr_progress_v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify({sel:[...sel],count,S}));}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!d) return;
    if(Array.isArray(d.sel)) sel=new Set(d.sel.filter(n=>LECT[n]));
    if(["20","40","all"].includes(d.count)) count=d.count;
    if(d.S&&Array.isArray(d.S.list)&&d.S.list.length&&d.S.i<=d.S.list.length) S=d.S;
  }catch(e){}
}

function home(){
  const pool=Q.filter(x=>sel.has(x[0])).length;
  const resume=S&&!S.done;
  app.innerHTML=`${resume?`<div class="card resume">
    <b>لديك اختبار لم يكتمل</b>
    <p class="lead">وصلت إلى السؤال ${S.i+1} من ${S.list.length}، والصحيح حتى الآن ${S.score}.</p>
    <div class="row"><button class="btn" id="cont">متابعة من حيث توقفت</button></div>
  </div>`:""}
  <div class="card">
    <h1>${resume?"أو ابدأ اختبارًا جديدًا":"اختبر نفسك قبل الميد"}</h1>
    <p class="lead">${Q.length} سؤال من المحاضرات 2 إلى 6، مع تفسير لكل إجابة. الأسئلة والخيارات تُخلط في كل مرة، وتقدّمك يُحفظ تلقائيًا.</p>
    <span class="label">المحاضرات</span>
    <div class="chips" id="lects">
      ${KEYS.map(n=>`<button class="chip" type="button" data-l="${n}" aria-pressed="${sel.has(n)}">${n}. ${LECT[n]}</button>`).join("")}
    </div>
    <span class="label">عدد الأسئلة</span>
    <div class="chips" id="cnt">
      ${["20","40","all"].map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${count===c}">${c==="all"?"الكل":c}</button>`).join("")}
    </div>
    <div class="row"><button class="btn${resume?" ghost":""}" id="go" ${pool?"":"disabled"}>ابدأ اختبارًا جديدًا</button></div>
    <div class="stat">متاح: ${pool} سؤال${resume?" · بدء اختبار جديد يستبدل الاختبار غير المكتمل":""}</div>
  </div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const n=+b.dataset.l;sel.has(n)?sel.delete(n):sel.add(n);save();home();});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{count=b.dataset.c;save();home();});
  document.getElementById("go").onclick=()=>start(Q.filter(x=>sel.has(x[0])),count);
  const c=document.getElementById("cont"); if(c) c.onclick=render;
  window.scrollTo(0,0);
}

function start(raws,limit){
  let list=shuffle(raws);
  if(limit!=="all") list=list.slice(0,+limit);
  S={list:list.map(prep),raws:list,i:0,score:0,wrong:[],done:false,answered:false,pick:null};
  save();
  render();
}

function render(){
  const q=S.list[S.i], n=S.list.length;
  app.innerHTML=`<div class="top"><span>السؤال ${S.i+1} من ${n} · الصحيح: ${S.score}</span><button class="link" type="button" id="menu">القائمة</button></div>
  <div class="bar"><i style="width:${(S.i/n)*100}%"></i></div>
  <div class="card">
    <span class="tag">المحاضرة ${q.l} · ${LECT[q.l]}</span>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.o.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row" id="nav" hidden><button class="btn" id="next">${S.i+1<n?"السؤال التالي":"عرض النتيجة"}</button></div>
  </div>
  <p class="hint">تقدّمك يُحفظ تلقائيًا · اختصارات: 1–4 للاختيار، Enter للتالي</p>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  document.getElementById("next").onclick=next;
  document.getElementById("menu").onclick=home;
  if(S.answered&&S.pick!==null) paint(S.pick);
  window.scrollTo(0,0);
}

function answer(i){
  if(S.answered) return;
  const q=S.list[S.i], ok=i===q.a;
  S.answered=true; S.pick=i;
  if(ok) S.score++; else S.wrong.push({q,raw:S.raws[S.i],pick:i});
  save();
  paint(i);
  document.querySelector(".top span").textContent=`السؤال ${S.i+1} من ${S.list.length} · الصحيح: ${S.score}`;
}

function paint(i){
  const q=S.list[S.i], ok=i===q.a;
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("bad");});
  document.getElementById("fb").innerHTML=`<div class="exp ${ok?"ok":"bad"}"><b>${ok?"إجابة صحيحة ✓":"إجابة خاطئة ✗ — الصحيح: "+esc(q.o[q.a])}</b>${esc(q.e)}</div>`;
  document.getElementById("nav").hidden=false;
  document.getElementById("next").focus({preventScroll:true});
}

function next(){
  if(!S.answered) return;
  S.i++; S.answered=false; S.pick=null;
  if(S.i<S.list.length){save();render();}
  else{S.done=true;save();result();}
}

function result(){
  const n=S.list.length, pct=Math.round(S.score/n*100);
  const msg=pct>=90?"ممتاز، أنت جاهز.":pct>=75?"جيد جدًا، راجع الأخطاء أدناه.":pct>=50?"مقبول، أعد الأسئلة الخاطئة.":"راجع الملخص ثم أعد المحاولة.";
  app.innerHTML=`<div class="card">
    <div class="score">${pct}%</div>
    <p class="lead">${S.score} من ${n} صحيحة. ${msg}</p>
    <div class="row">
      ${S.wrong.length?`<button class="btn" id="retry">أعد الأسئلة الخاطئة (${S.wrong.length})</button>`:""}
      <button class="btn ghost" id="again">اختبار جديد</button>
    </div>
    ${S.wrong.length?`<div class="review"><span class="label">مراجعة الأخطاء</span>${S.wrong.map(w=>`<div class="rv"><div class="rq">${esc(w.q.q)}</div><div class="ra">✓ ${esc(w.q.o[w.q.a])}</div><div class="re">${esc(w.q.e)}</div></div>`).join("")}</div>`:""}
  </div>`;
  const r=document.getElementById("retry"); if(r) r.onclick=()=>start(S.wrong.map(w=>w.raw),"all");
  document.getElementById("again").onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!S||!app.querySelector(".opt")) return;
  if(/^[1-4]$/.test(e.key)){const b=app.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click();}
  if(e.key==="Enter"&&S.answered){e.preventDefault();next();}
});

const root=document.documentElement;
document.getElementById("theme").onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("theme",root.dataset.theme);}catch(e){}
};
try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t;}catch(e){}

load();
if(S&&!S.done) render();
else if(S&&S.done) result();
else home();
</script>
</body>
</html>
