<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الرأي العام</title>
<meta name="description" content="اختبار تفاعلي شامل لمقرر الرأي العام — المحاضرات 1 إلى 5، مع تفسير لكل إجابة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --ok:#1e7a46; --ok-soft:#e2f3e8; --bad:#b33a2b; --bad-soft:#f8e3df;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --card:#1f1e1c; --ink:#efece6; --muted:#a39d92; --line:#34322e;
    --accent:#6fb0de; --accent-soft:#1d2f3d;
    --ok:#5cc38a; --ok-soft:#173226; --bad:#ec7b6b; --bad-soft:#3a1f1b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1f1e1c; --ink:#efece6; --muted:#a39d92; --line:#34322e;
  --accent:#6fb0de; --accent-soft:#1d2f3d;
  --ok:#5cc38a; --ok-soft:#173226; --bad:#ec7b6b; --bad-soft:#3a1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-weight:700;font-size:1.15rem}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
h1{font-size:1.6rem;margin:0 0 6px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 20px}
.label{font-weight:600;font-size:.9rem;margin:18px 0 8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{color:var(--muted);font-size:.85rem;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 10px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.exp{margin-top:16px;border-radius:12px;padding:14px 16px;border-inline-start:4px solid}
.exp.ok{background:var(--ok-soft);border-color:var(--ok)}
.exp.bad{background:var(--bad-soft);border-color:var(--bad)}
.exp b{display:block;margin-bottom:4px}
.score{font-size:3rem;font-weight:700;color:var(--accent);line-height:1.2}
.review{margin-top:22px;display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .ra{color:var(--ok);font-weight:600}
.rv .re{color:var(--muted);font-size:.92rem;margin-top:4px}
.hint{color:var(--muted);font-size:.8rem;margin-top:14px;text-align:center}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
@media (max-width:480px){.card{padding:18px}.q{font-size:1.08rem}h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">اختبار الرأي العام<small>المحاضرات 1 – 5</small></div>
    <button class="icon-btn" id="theme" type="button">الوضع</button>
  </header>
  <main id="app"></main>
  <footer>كل الأسئلة مبنية على شرائح المقرر — جامعة الملك فيصل</footer>
</div>

<script>
// [lecture, question, options[], correctIndex, explanation, keepOrder?]
const TF=["صح","خطأ"];
const Q=[
// ===== المحاضرة 1: المفهوم والتعريف =====
[1,"في أي قرن ظهر مصطلح «الرأي العام»؟",["القرن الثامن عشر","القرن الخامس عشر","القرن التاسع عشر","القرن العشرين"],0,"تنص الشريحة على أن المصطلح ظهر في القرن الثامن عشر، ومع ذلك يصعب على الباحثين تحديده تحديدًا دقيقًا."],
[1,"يذهب بعض الباحثين إلى أن القدرة على قياس الرأي العام:",["تفوق القدرة على تعريفه","أقل من القدرة على تعريفه","تساوي القدرة على تعريفه","مستحيلة تمامًا"],0,"الرأي العام صعب الوصف، لذلك يرى بعض الباحثين أن قياسه أسهل من تعريفه."],
[1,"الرأي العام هو مجموع الآراء التي يحملها الناس حول قضية:",["خلافية","محسومة","عقدية","شخصية"],0,"التعريف: مجموع الآراء حول قضية خلافية معطاة، تصل إلى جهات مسؤولة."],
[1,"يُعد الرأي العام بمثابة ... الذي يضبط سلوك الناس الاجتماعي:",["الرادار","الميزان","البوصلة","الدستور"],0,"وصف الرأي العام بأنه الرادار الذي يضبط السلوك الاجتماعي، ولذلك يلتزم به الناس غالبًا."],
[1,"من سمّى الرأي العام «صوت الشعب»؟",["ميكافيللي","مونتسكيو","جان جاك روسو","جيمس برايس"],0,"ميكافيللي: صوت الشعب. مونتسكيو: العقل العام. روسو: الإرادة العامة."],
[1,"من أطلق على الرأي العام تسمية «العقل العام»؟",["مونتسكيو","ميكافيللي","روسو","هربرت بلومر"],0,"مونتسكيو هو صاحب تسمية «العقل العام»."],
[1,"اقترح جان جاك روسو للرأي العام اسم:",["الإرادة العامة","صوت الشعب","العقل العام","الضمير الجمعي"],0,"روسو اقترح «الإرادة العامة»."],
[1,"يوجد تعريف واحد موحد متفق عليه للرأي العام حتى الآن.",TF,1,"خطأ. الشرائح تنص على أنه لا يوجد تعريف واحد موحد حتى الآن، لأن التعريفات تنطلق من رؤى ومجتمعات مختلفة.",1],
[1,"أيّ مما يلي ليس من الأقوال التي وردت عن الرأي العام؟",["رأي النخبة الحاكمة فقط","الرغبة العامة للمجتمع","رأي الغالبية","نتائج الاستفتاءات التي يجريها الشعب"],0,"وردت الأقوال: الرغبة العامة، آراء وضعت بواسطة الجمهور عبر الإعلام، معتقدات جماهير مختلفة، رأي الغالبية، نتائج الاستفتاءات. ولم يرد «رأي النخبة الحاكمة»."],
[1,"«الفكرة السائدة بين جمهور من الناس تربطهم مصلحة مشتركة» هو تعريف:",["إبراهيم إمام","مختار التهامي","أحمد بدر","ليونارد دووب"],0,"مفتاح تعريف إبراهيم إمام: «الفكرة السائدة» + «مصلحة مشتركة»."],
[1,"«الرأي السائد بين غالبية الشعب الواعية في فترة معينة» هو تعريف:",["مختار التهامي","إبراهيم إمام","جيمس برايس","هربرت بلومر"],0,"مفتاح تعريف مختار التهامي: «غالبية الشعب الواعية» و«يحتدم فيها الجدل»."],
[1,"«التعبير الحر عن آراء الناخبين للتأثير» هو تعريف:",["أحمد بدر","مختار التهامي","ليونارد دووب","إبراهيم إمام"],0,"أحمد بدر ربط الرأي العام بالناخبين، بحيث يكون التعبير ممثلًا لرأي الأغلبية."],
[1,"من قال إن الرأي العام ليس بالضرورة رأي الأغلبية، فقد تكون هناك أقلية مؤثرة في تشكيله؟",["هربرت بلومر","أحمد بدر","جيمس برايس","مختار التهامي"],0,"هربرت بلومر: الرأي العام نتاج تفاعل جماعات في سياق اجتماعي سياسي، وليس بالضرورة رأي الأغلبية."],
[1,"«مجموعة الآراء التي يدين بها الناس إزاء القضايا التي تهم الجماعة» هو تعريف:",["جيمس برايس","ليونارد دووب","إبراهيم إمام","هربرت بلومر"],0,"مفتاح جيمس برايس: «يدين بها الناس»."],
[1,"«اتجاهات الناس حينما يكونون أعضاء في نفس الجماعة الاجتماعية» هو تعريف:",["ليونارد دووب","جيمس برايس","أحمد بدر","مختار التهامي"],0,"مفتاح ليونارد دووب: «أعضاء في نفس الجماعة»."],
[1,"حسب تعريف مختار التهامي، القضية تمس المصالح الإنسانية أو القيم الأساسية مسًّا:",["مباشرًا","غير مباشر","جزئيًا","مؤقتًا"],0,"نص التعريف: تمس المصالح الإنسانية أو القيم الأساسية لهذه الغالبية مسًّا مباشرًا."],
[1,"حسب هربرت بلومر، الرأي العام نتاج للتفاعل بين جماعات في سياق:",["اجتماعي سياسي","اقتصادي فقط","ديني","إعلامي فقط"],0,"بلومر: يحدث التفاعل في سياق اجتماعي سياسي."],
[1,"من القواسم المشتركة في تعريفات الرأي العام أنه:",["ديناميكي ومن سماته الحركة والتبدل","ثابت لا يتغير","فردي لا علاقة له بالجماعة","لا يتأثر بالأحداث"],0,"الرأي العام ديناميكي، فلكل زمان أحداث ورأي عام مختلف."],
[1,"الرأي العام ثابت لا يتغير بتغير الزمان والأحداث.",TF,1,"خطأ. من سماته الحركة والتبدل والتطور، ولكل زمان رأي عام مختلف.",1],
[1,"الرأي العام نتاج اجتماعي لعملية:",["اتصال وتأثير متبادل بين الجماعات والأفراد","تفكير فردي منعزل","قرار حكومي","وراثة ثقافية فقط"],0,"تنص الشريحة: الرأي العام نتاج اجتماعي لعملية اتصال وتأثير متبادل بين الجماعات والأفراد."],
[1,"من القواسم المشتركة: يكون الرأي العام ذا حساسية عالية تجاه:",["الأحداث الهامة الجارية في المجتمع","الشؤون الشخصية للأفراد","الأحداث التاريخية فقط","القضايا العلمية البحتة"],0,"الرأي العام ذو حساسية عالية تجاه الأحداث الهامة الجارية في المجتمع."],
[1,"بعد انقسام الناس حول القضية، فإنهم:",["يدخلون في نقاش علني ويحتدم بينهم الجدل","يتوقفون عن التفكير فيها","يتركونها للسلطة","ينسونها"],0,"تسلسل القواسم: ينقسم الناس، ثم يدخلون في نقاش علني، ثم يتأثرون بعوامل مختلفة، ثم يتصرفون جماعيًا للخروج برأي عام."],
[1,"عرّف المفكرون الرأي العام بأنه:",["عقل الجماعة أو الضمير الجمعي","رأي الفرد الأذكى","صوت الحاكم","رأي الإعلام"],0,"سُمّي «عقل الجماعة» أو «الضمير الجمعي» لأنه يظهر بسبب التفاعل بين نشاط أفراد الجماعة."],
[1,"الرأي العام لم يكن له وجود في العصور القديمة.",TF,1,"خطأ. لكل عصر وسائله الخاصة في التعبير عن آرائه، وإن كان الاصطلاح نفسه حديثًا.",1],
[1,"استحوذ الرأي العام على الاهتمام لأنه يشكل أحد العوامل المهمة في عملية:",["صنع القرار","الإنتاج الصناعي","التعليم","البحث العلمي"],0,"الرأي العام أحد العوامل المهمة في عملية صنع القرار."],
[1,"أيّ مما يلي ساعد على مضاعفة تأثير قوة الرأي العام؟",["ظهور المدن الكبيرة بعد الثورة الصناعية وانتشار التعليم","انخفاض عدد السكان","تراجع وسائل الاتصال","انعزال المجتمعات"],0,"التقدم العلمي، المدن الكبيرة، الطباعة، التعليم، ووسائل الاتصال الجماهيري ساعدت على انتشار الآراء وزيادة تأثير الرأي العام."],
[1,"يقول بعض المهتمين إنه لا شيء يمكن أن ينجح دون:",["مساعدة الرأي العام","دعم الحكومة","التمويل","الإعلام"],0,"أصبح الرأي العام حقيقة لا يمكن تجاهلها، ولا شيء ينجح دون مساعدته."],
[1,"يُعد الرأي العام ثمرة تفاعل ... في أحد المواقف التي تمر بها مجموعة من الناس:",["الأفكار","المصالح الفردية","القوانين","الأحداث العالمية"],0,"الرأي العام ثمرة تفاعل الأفكار في أحد المواقف التي تمر بها جماعة من الناس."],

// ===== المحاضرة 2: النشأة والتطور =====
[2,"في أي سنة كان يوليوس قيصر مهتمًا بأن تكون مناقشات البرلمان معروفة؟",["59 قبل الميلاد","95 قبل الميلاد","59 ميلادية","1774"],0,"يوليوس قيصر سنة 59 ق.م جعل مناقشات البرلمان محط اهتمام جمهور روما."],
[2,"كيف جعل يوليوس قيصر مناقشات البرلمان محط اهتمام جمهور روما؟",["من خلال صحيفة تنشر أخبار مجلس الشيوخ ومجلس النواب","عبر الخطابات في الساحات","بالاستفتاءات الشعبية","عبر المعابد"],0,"كانت هناك صحيفة تنشر أخبار الأنشطة الخاصة بمجلس الشيوخ ومجلس النواب."],
[2,"الروماني الذي كان يعتقد أن الأفراد يستطيعون تكوين آرائهم الخاصة هو:",["ماركوس أوريليوس","يوليوس قيصر","ميكافيللي","أفلاطون"],0,"ماركوس أوريليوس (يُكتب في الشرائح أبورليوس) من الرومانيين الذين اعتقدوا بذلك."],
[2,"شكلت الانطلاقة الحقيقية لدور الرأي العام:",["الشرائع السماوية","الثورة الفرنسية","الثورة الصناعية","الحرب العالمية الأولى"],0,"لم تكن الثورة الفرنسية ولا الصناعية نقطة الانطلاق، بل الشرائع السماوية لما تحمله من أفكار جلبت أعدادًا هائلة من الجماهير."],
[2,"الثورة الفرنسية هي نقطة انطلاق الرأي العام.",TF,1,"خطأ. الشرائح تنص صراحة على أن الشرائع السماوية هي الانطلاقة الحقيقية، لا الثورة الفرنسية ولا الصناعية.",1],
[2,"كان الإسلام بمثابة ... جمعت حولها عددًا كبيرًا من الناس:",["أيديولوجية سماوية","حركة سياسية","ثورة اقتصادية","مدرسة فلسفية"],0,"الإسلام كان «أيديولوجية سماوية» شكّلت أمة مؤثرة من أجناس مختلفة يجمعها رأي ديني واحد."],
[2,"ما الحدث الذي وجّه الأنظار إلى أهمية وتأثير الدعاية في الوعي العام؟",["الحرب العالمية الأولى","الحرب العالمية الثانية","الثورة الفرنسية","اختراع الطباعة"],0,"الرأي العام كان قرينًا بالحياة الجماعية قبل أن توجّه الحرب العالمية الأولى الأنظار إلى أهمية الدعاية."],
[2,"القبول العام بالقيم والعادات والتقاليد السائدة يثمر بالضرورة:",["رأيًا عامًا يجاهر باحترامها ويوقع القصاص بمن يخالفها","رأيًا خاصًا لا يظهر","فوضى اجتماعية","تمردًا على التقاليد"],0,"هذا دليل على أن الرأي العام موجود في المجتمعات قبل أن يكتسب تسميته."],

[5,"ينقسم الرأي العام وفقًا لدرجة الصراحة إلى:",["الرأي الشخصي والرأي الخاص","الظاهر والكامن","الأغلبية والأقلية","المحلي والدولي"],0,"درجة الصراحة: Personal و Private."],
[5,"يعبّر تقسيم الرأي العام وفقًا لدرجة الصراحة عن:",["درجة أو إمكانية إفصاح الشخص عما بداخله","حجم الجمهور","مدة بقاء الرأي","النطاق الجغرافي"],0,"إما بكل صراحة، أو مع موانع تحول دون إبداء الرأي إلا في حالات خاصة."],
[5,"المصطلح Landslide يقابله:",["الرأي العام الساحق","الإجماع","الائتلافي","الأغلبية"],0,"Landslide = الساحق. Consensus = الإجماع. Coalition = الائتلافي. Majority = الأغلبية."],
[5,"المصطلح Pioneering يقابله:",["الرأي العام النشط القائد","الرأي الواعي","الرأي المنقاد","الرأي الدائم"],0,"Pioneering = النشط/المسيطر/القائد. Conscious = الواعي. Passive = المنقاد."],
[5,"المصطلح Consensus يقابله:",["الإجماع","الائتلافي","الساحق","الأقلية"],0,"Consensus = الإجماع."],
[5,"المصطلح Passive يقابله:",["الرأي المنقاد أو المنساق","الرأي النشط","الرأي الخاص","الرأي الكامن"],0,"Passive = المنقاد."],
[5,"المصطلح Coalition يقابله:",["الرأي الائتلافي","الإجماع","الأغلبية","الساحق"],0,"Coalition = الائتلافي."],
[4,"المصطلح Temporary يقابله:",["الرأي العام المؤقت","الرأي اليومي","الرأي الدائم","الرأي الكامن"],0,"Daily = يومي. Temporary = مؤقت. Permanent = دائم."],
[4,"المصطلح Regional يقابله:",["الرأي العام الإقليمي","المحلي","الوطني","الدولي"],0,"Local = محلي. National = وطني. Regional = إقليمي. International = دولي."]
];

const LECT={1:"المفهوم والتعريف",2:"النشأة والتطور",3:"الشخصي والعام والأهمية",4:"الجغرافي والزمني",5:"التأثير والحجم والوضوح"};
const app=document.getElementById("app");
const LETTERS=["أ","ب","ج","د"];
let sel=new Set([1,2,3,4,5]), count="all", S=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function prep(raw){
  const [l,q,o,a,e,keep]=raw;
  if(keep) return {l,q,o:o.slice(),a,e};
  const idx=shuffle(o.map((_,i)=>i));
  return {l,q,o:idx.map(i=>o[i]),a:idx.indexOf(a),e};
}

function home(){
  const pool=Q.filter(x=>sel.has(x[0])).length;
  app.innerHTML=`<div class="card">
    <h1>اختبر نفسك قبل الميد</h1>
    <p class="lead">${Q.length} سؤال من المحاضرات الخمس، مع تفسير لكل إجابة. الأسئلة والخيارات تُخلط في كل مرة.</p>
    <span class="label">المحاضرات</span>
    <div class="chips" id="lects">
      ${[1,2,3,4,5].map(n=>`<button class="chip" type="button" data-l="${n}" aria-pressed="${sel.has(n)}">${n}. ${LECT[n]}</button>`).join("")}
    </div>
    <span class="label">عدد الأسئلة</span>
    <div class="chips" id="cnt">
      ${["20","40","all"].map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${count===c}">${c==="all"?"الكل":c}</button>`).join("")}
    </div>
    <div class="row"><button class="btn" id="go" ${pool?"":"disabled"}>ابدأ الاختبار</button></div>
    <div class="stat">متاح: ${pool} سؤال</div>
  </div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const n=+b.dataset.l;sel.has(n)?sel.delete(n):sel.add(n);home();});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{count=b.dataset.c;home();});
  document.getElementById("go").onclick=()=>start(Q.filter(x=>sel.has(x[0])));
}

function start(raws){
  let list=shuffle(raws);
  if(count!=="all") list=list.slice(0,+count);
  S={list:list.map(prep),raws:list,i:0,score:0,wrong:[],done:false};
  render();
}

function render(){
  const q=S.list[S.i], n=S.list.length;
  app.innerHTML=`<div class="top"><span>السؤال ${S.i+1} من ${n}</span><span>الصحيح: ${S.score}</span></div>
  <div class="bar"><i style="width:${(S.i/n)*100}%"></i></div>
  <div class="card">
    <span class="tag">المحاضرة ${q.l} · ${LECT[q.l]}</span>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.o.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row" id="nav" hidden><button class="btn" id="next">${S.i+1<n?"السؤال التالي":"عرض النتيجة"}</button></div>
  </div>
  <p class="hint">اختصارات: 1–4 للاختيار، Enter للتالي</p>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  document.getElementById("next").onclick=next;
  S.answered=false;
}

function answer(i){
  if(S.answered) return; S.answered=true;
  const q=S.list[S.i], ok=i===q.a;
  if(ok) S.score++; else S.wrong.push({q,raw:S.raws[S.i],pick:i});
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("bad");});
  document.getElementById("fb").innerHTML=`<div class="exp ${ok?"ok":"bad"}"><b>${ok?"إجابة صحيحة ✓":"إجابة خاطئة ✗ — الصحيح: "+esc(q.o[q.a])}</b>${esc(q.e)}</div>`;
  document.getElementById("nav").hidden=false;
  document.getElementById("next").focus();
}

function next(){ if(!S.answered) return; S.i++; S.i<S.list.length?render():result(); }

function result(){
  const n=S.list.length, pct=Math.round(S.score/n*100);
  const msg=pct>=90?"ممتاز، أنت جاهز.":pct>=75?"جيد جدًا، راجع الأخطاء أدناه.":pct>=50?"مقبول، أعد الأسئلة الخاطئة.":"راجع الملخص ثم أعد المحاولة.";
  app.innerHTML=`<div class="card">
    <div class="score">${pct}%</div>
    <p class="lead">${S.score} من ${n} صحيحة. ${msg}</p>
    <div class="row">
      ${S.wrong.length?`<button class="btn" id="retry">أعد الأسئلة الخاطئة (${S.wrong.length})</button>`:""}
      <button class="btn ghost" id="again">اختبار جديد</button>
    </div>
    ${S.wrong.length?`<div class="review"><span class="label">مراجعة الأخطاء</span>${S.wrong.map(w=>`<div class="rv"><div class="rq">${esc(w.q.q)}</div><div class="ra">✓ ${esc(w.q.o[w.q.a])}</div><div class="re">${esc(w.q.e)}</div></div>`).join("")}</div>`:""}
  </div>`;
  const r=document.getElementById("retry"); if(r) r.onclick=()=>{const c=count;count="all";start(S.wrong.map(w=>w.raw));count=c;};
  document.getElementById("again").onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!S||!app.querySelector(".opt")) return;
  if(/^[1-4]$/.test(e.key)){const b=app.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b)b.click();}
  if(e.key==="Enter"&&S.answered){e.preventDefault();next();}
});

const root=document.documentElement;
document.getElementById("theme").onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("theme",root.dataset.theme);}catch(e){}
};
try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t;}catch(e){}

home();
</script>
</body>
</html>
