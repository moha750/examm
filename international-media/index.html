<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار الإعلام الدولي</title>
<meta name="description" content="اختبار تفاعلي شامل لمقرر الإعلام الدولي — مع تفسير لكل إجابة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --ok:#1e7a46; --ok-soft:#e2f3e8; --bad:#b33a2b; --bad-soft:#f8e3df;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --card:#1f1e1c; --ink:#efece6; --muted:#a39d92; --line:#34322e;
    --accent:#6fb0de; --accent-soft:#1d2f3d;
    --ok:#5cc38a; --ok-soft:#173226; --bad:#ec7b6b; --bad-soft:#3a1f1b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1f1e1c; --ink:#efece6; --muted:#a39d92; --line:#34322e;
  --accent:#6fb0de; --accent-soft:#1d2f3d;
  --ok:#5cc38a; --ok-soft:#173226; --bad:#ec7b6b; --bad-soft:#3a1f1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.brand{font-weight:700;font-size:1.15rem}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:.85rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}
h1{font-size:1.6rem;margin:0 0 6px;line-height:1.4}
.lead{color:var(--muted);margin:0 0 20px}
.label{font-weight:600;font-size:.9rem;margin:18px 0 8px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:600;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{color:var(--muted);font-size:.85rem;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:2px 10px;font-size:.78rem;font-weight:600;margin-bottom:10px}
.q{font-size:1.2rem;font-weight:600;margin:0 0 18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{flex:none;width:26px;height:26px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{background:var(--bad);color:#fff}
.exp{margin-top:16px;border-radius:12px;padding:14px 16px;border-inline-start:4px solid}
.exp.ok{background:var(--ok-soft);border-color:var(--ok)}
.exp.bad{background:var(--bad-soft);border-color:var(--bad)}
.exp b{display:block;margin-bottom:4px}
.score{font-size:3rem;font-weight:700;color:var(--accent);line-height:1.2}
.review{margin-top:22px;display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:14px}
.rv .rq{font-weight:600;margin-bottom:6px}
.rv .ra{color:var(--ok);font-weight:600}
.rv .re{color:var(--muted);font-size:.92rem;margin-top:4px}
.link{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.resume{margin-bottom:16px;border-color:var(--accent)}
.resume .lead{margin:4px 0 0}
.hint{color:var(--muted);font-size:.8rem;margin-top:14px;text-align:center}
footer{color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
@media (max-width:480px){.card{padding:18px}.q{font-size:1.08rem}h1{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">الإعلام الدولي<small>المفهوم · الأبعاد · الإذاعات الموجهة · وكالات الأنباء</small></div>
    <button class="icon-btn" id="theme" type="button">الوضع</button>
  </header>
  <main id="app"></main>
  <footer>كل الأسئلة مبنية على شرائح المقرر<br>برمجة وتطوير: <strong>محمد إسماعيل المطر</strong></footer>
</div>

<script>
// [lecture, question, options[], correctIndex, explanation, keepOrder?]
const TF=["صح","خطأ"];
const Q=[
// ===== 1: المدخل والمفهوم والتعريف =====
[1,"يُوصف عصرنا الحاضر بأنه عصر الإعلام لأن:",["وسائله الحديثة بلغت غايات بعيدة في عمق الأثر وقوة التوجيه","الإعلام ظاهرة جديدة في تاريخ البشرية","الإعلام لم يكن موجودًا قبل القرن العشرين","وسائله أصبحت أرخص فقط"],0,"ليس لأن الإعلام ظاهرة جديدة، بل لأن وسائله الحديثة بلغت غايات بعيدة في عمق الأثر وقوة التوجيه وشدة الخطورة."],
[1,"الإعلام ظاهرة جديدة في تاريخ البشرية، ولهذا يُسمى عصرنا عصر الإعلام.",TF,1,"خطأ. الإعلام ليس ظاهرة جديدة؛ السبب أن وسائله الحديثة بلغت غايات بعيدة في عمق الأثر.",1],
[1,"لا يمكن أن يحدث الاتصال إلا من خلال:",["نسق اجتماعي","وسيلة إلكترونية","مؤسسة حكومية","لغة واحدة"],0,"المجتمع الإنساني لا يستطيع الحياة دون اتصال، والاتصال لا يحدث إلا من خلال نسق اجتماعي."],
[1,"اتفق الباحثون على أن وسائل الإعلام تؤثر، لكنهم اختلفوا في:",["إلى أي حد؟ ومتى؟ وفي أي الظروف؟ وبأية كيفية؟","هل تؤثر أم لا","من يملكها","عدد الوسائل"],0,"هناك إجماع على أنها تؤثر، أما حدود التأثير وظروفه وكيفيته فلم يجتمع عليها الباحثون."],
[1,"الفئة الأكثر عرضة للغزو الثقافي عبر وسائل الإعلام بسبب ضعف بنائها الذاتي:",["الأميون والأطفال والمراهقون ومحدودو الثقافة الأصلية","المثقفون والأكاديميون","كبار السن المتعلمون","الإعلاميون"],0,"ترتفع نسبة التأثر بالمضامين المخالفة في الأميين والأطفال والمراهقين ومحدودي الثقافة الأصلية."],
[1,"من المؤثرات الثقافية التي تشكل شخصية الفرد:",["التنشئة الاجتماعية والأسرة والمدرسة والمؤسسات الدينية","وسائل الإعلام الأجنبية فقط","الشركات متعددة الجنسيات","وكالات الأنباء"],0,"التنشئة الاجتماعية والأسرة والبيت والمدرسة والمؤسسات الدينية تشكل المؤثرات الثقافية."],
[1,"هناك إجماع بين الباحثين في قضية «التبعية في المجال الإعلامي» على إرجاع جوهر التبعية الثقافية في العالم الثالث إلى:",["عوامل تاريخية تتعلق بالسيطرة الاستعمارية الغربية والمحاولات الدؤوبة لأمريكا للسيطرة","ضعف اللغة العربية","قلة عدد السكان","كثرة الصحف المحلية"],0,"تُرجع إلى عوامل تاريخية تتعلق بالسيطرة الاستعمارية الغربية مضافًا إليها محاولات الولايات المتحدة."],
[1,"مصطلح «الحتمية التكنولوجية» يرتبط بـ:",["ماكلوهان","باتريس بارا","هستر","ماكبرايد"],0,"تقتضي طبيعة التحول التي تقود إليها التقنية النظر فيما يسميه «ماكلوهان» بالحتمية التكنولوجية."],
[1,"وصف «ماكلوهان» العالم بفضل التطورات التكنولوجية بأنه:",["قرية صغيرة (عالمية)","سوق مفتوح","غرفة مظلمة","كرة معلوماتية"],0,"أصبح العالم قرية صغيرة كما وصفها «مكالوهان»، بحيث تلاشت الحدود القومية."],
[1,"بفضل ثورة الاتصال أصبح العالم قرية صغيرة بل:",["غرفة مكشوفة","مدينة كبيرة","سوقًا عالمية","شبكة مغلقة"],0,"أصبح العالم بفضلها قرية صغيرة بل غرفة مكشوفة."],
[1,"من مميزات الأقمار الصناعية:",["اجتياز العوائق الطبيعية للإرسال مثل الجبال والمحيطات والصحارى","الحاجة إلى كابلات أرضية","التأثر بالتشويش الجوي","ارتفاع التكلفة دائمًا"],0,"تجتاز العوائق الطبيعية، وتتيح اتصالًا من نقطة إلى عدة نقاط، ولا تواجه عقبات الغلاف الجوي، واقتصادية."],
[1,"تتيح الوصلة الفضائية اتصالًا مباشرًا:",["من نقطة الإنترنت إلى عدة نقاط في الوقت نفسه","من نقطة إلى نقطة واحدة فقط","عبر الكابلات فقط","في الدولة الواحدة فقط"],0,"من مميزات الأقمار الصناعية."],
[1,"الترددات الفضائية تواجه عقبات جوية مثل التشويش وتكثيف الغلاف الجوي.",TF,1,"خطأ. لا تواجه الترددات الفضائية العقبات الجوية التي تصادف انتشارها في المحيط الأرضي.",1],
[1,"ظل الإعلام الدولي في العالم الثالث لفترة طويلة يُطرح مرتبطًا بقضايا:",["التدفق الحر غير المتوازن للمعلومات من الشمال إلى الجنوب والتبعية وبناء الصور النمطية","التنمية الاقتصادية فقط","حرية الصحافة المحلية","الإعلانات التجارية"],0,"ارتبط بالتدفق غير المتوازن من الشمال إلى الجنوب، والتبعية الإعلامية والثقافية، والصور النمطية السلبية عن الجنوب."],
[1,"يُعد الاتصال الدولي من المفاهيم الحديثة المتداخلة مع علوم أخرى مثل:",["العلاقات الدولية والعلوم السياسية والقانون الدولي وتكنولوجيا المعلومات","الكيمياء والفيزياء","الطب والصيدلة","الهندسة المدنية"],0,"يتداخل مع العلاقات الدولية والعلوم السياسية والقانون الدولي والاقتصاد الدولي والدراسات الاستراتيجية وتكنولوجيا المعلومات، ولذا يتسم بشدة التعقيد."],
[1,"انقسم العالم في ظل تطور الاتصال الدولي إلى:",["دول مركزية (الشمال المتقدم) ودول غير مركزية (الجنوب النامي)","دول ساحلية وداخلية","دول غنية بالنفط وفقيرة","دول ملكية وجمهورية"],0,"دول الشمال تمتلك تقنيات الاتصال وتسيطر عليها، ودول الجنوب تستهلكها نظرًا للفجوة التقنية."],
[1,"من المهام الأساسية للاتصال الدولي التي تخدم مصالح الدول:",["نشر المعلومات لتحقيق صورة إيجابية للدولة خارج أراضيها والتصدي للدعاية المضادة","الترفيه المحلي فقط","جمع الضرائب","التعليم المدرسي"],0,"نشر المعلومات والأفكار لتحقيق صورة إيجابية، والتعبير عن السياسة، وتفسير المواقف، والتصدي للدعاية المضادة."],
[1,"يشير مصطلح الإعلام الدولي إلى التحليل الثقافي والاقتصادي والسياسي والاجتماعي والتقني:",["للنماذج الاتصالية وآثارها بين الدول","للصحف المحلية","للإعلانات التجارية فقط","للبرامج الترفيهية"],0,"الإعلام الدولي يركز بشكل أكبر على الجوانب العالمية لوسائل الإعلام أكثر من القضايا المحلية."],
[1,"منذ تسعينيات القرن العشرين انخفض حضور القضايا العالمية في الإعلام بسبب حدثين هما:",["نهاية الحرب الباردة، وزيادة التبادل الاقتصادي بين الدول","الحرب العالمية الثانية وظهور التلفزيون","ظهور الإنترنت والهاتف المحمول","حرب الخليج وأحداث سبتمبر"],0,"الحدث الأول نهاية الحرب الباردة، والثاني زيادة التبادل الاقتصادي لتثبيت فكرة الاقتصاد العالمي."],
[1,"علاقة التبادل بين الدول بعد نهاية الحرب الباردة لم تكن اقتصادية فقط، بل لها بعد:",["ثقافي","عسكري","ديني","رياضي"],0,"تجدر الإشارة إلى أن علاقة التبادل لم تكن اقتصادية فقط بل كان لها بعد ثقافي أيضًا."],
[1,"في الحرب الباردة كانت تغطية الأحداث الدولية تُقدَّم في صورة:",["التقابل بين الغرب والشرق (الشيوعية مقابل الرأسمالية)","الشمال مقابل الجنوب","العرب مقابل الغرب","آسيا مقابل أوروبا"],0,"كانت أغلب اهتمامات تغطية الأحداث الدولية تقدم مادتها في صورة التقابل بين الغرب والشرق."],
[1,"يقدّر البعض أن القصص الإخبارية الدولية في النشرات الأمريكية الرئيسية لا تتعدى ... مقارنة بأكثر من ... في فترة الحرب الباردة:",["20% / 50%","50% / 80%","10% / 30%","30% / 60%"],0,"لا تتعدى 20% مقارنة بأكثر من 50% في فترة الحرب الباردة."],
[1,"من الأمثلة على انخفاض الاهتمام بالأخبار الخارجية: مجلة ... وصحيفة ... استبدلتا مكاتبهما الخارجية باهتمامات محلية:",["التايم / نيويورك تايمز","نيوزويك / واشنطن بوست","الإيكونومست / الغارديان","لوموند / لوفيغارو"],0,"مجلة «التايم» وصحيفة «نيويورك تايمز» استبدلت مكاتبها الخارجية باهتمامات داخلية."],
[1,"بعد سقوط الاتحاد السوفيتي تحولت النقاشات ومراكز القوة من واشنطن إلى:",["وول ستريت","موسكو","بروكسل","لندن"],0,"تحولت مراكز القوة من واشنطن إلى «وول ستريت»، ومن العوامل المؤثرة على وزارة الدفاع إلى تلك المؤثرة على أسواق المال."],
[1,"أشهر تعريفات الإعلام الدولي الموجزة:",["«انتقال الإشارات الصوتية والمرئية عبر الحدود الجغرافية»","«فن إقناع السواد الأعظم من الشعب»","«العملية الاتصالية داخل الدولة»","«نشر الإعلانات التجارية عالميًا»"],0,"من أشهر التعريفات: انتقال الإشارات الصوتية والمرئية عبر الحدود الجغرافية."],
[1,"من تعريفات الإعلام الدولي أنه وسيلة من وسائل:",["السياسة الخارجية لتحقيق المصلحة الوطنية للدولة","السياسة الداخلية","التسويق التجاري","التعليم"],0,"وسيلة من وسائل السياسة الخارجية، تختلف أهدافها باختلاف وزن الدولة ودورها في النظام الدولي."],
[1,"من تعريفات الإعلام الدولي: «نقل المعلومات الصحيحة ...»:",["غير الملوّنة أكثر مما يُقصد به أي شكل آخر من أشكال الاتصال","الملوّنة بوجهة نظر الدولة","التجارية","المحلية"],0,"الإعلام الدولي هو نقل المعلومات الصحيحة غير الملونة."],
[1,"التعريف الأكثر وضوحًا للإعلام الدولي:",["«نشاط اتصالي موجّه عابر للحدود الدولية له أهداف مدروسة ووسائل مختلفة»","«انتقال الإشارات عبر الحدود»","«وسيلة من وسائل السياسة الخارجية»","«الإعلام الذي يستجيب لرجل الشارع العالمي»"],0,"هذا التعريف يشتمل على مجموعة عناصر تحدد المفهوم بشكل أكثر وضوحًا."],
[1,"عنصر «نشاط اتصالي» في التعريف يوضح أن:",["الإعلام صورة من صور الاتصال، فالاتصال أعمّ وأوسع","الإعلام أعمّ من الاتصال","الإعلام والاتصال لا علاقة بينهما","الإعلام عشوائي"],0,"ومن هنا تزول الإشكالية في التسمية بين الإعلام الدولي والاتصال الدولي."],

[8,"من أسباب تحكم الوكالات الغربية بوسائل الإعلام العربية:",["طغيان النموذج الغربي لمضمون الأخبار الخارجية","قوة الوكالات العربية","اهتمام الغرب بأخبار التنمية","التوازن في التدفق"],0,"السبب الأول."],

[8,"عدد شروط نمو وكالات الأنباء في الدول النامية:",["أربعة","ثلاثة","ستة","سبعة"],0,"أربعة شروط."],
[8,"من شروط نمو وكالات الأنباء:",["مساهمة اليونسكو مع المنظمات الإقليمية في تدريب العاملين","زيادة الرقابة","تقليل المشتركين","الاعتماد على الوكالات العالمية"],0,"الشرط الثالث."],

[8,"ارتقت بعض وكالات الأنباء الوطنية إلى مصاف الوكالات العالمية الأربع.",TF,1,"خطأ. لا توجد أية وكالة أنباء في العالم ارتقت إلى مصافها، بل ازدادت الهوة اتساعًا.",1],
[8,"يرى المتتبعون أن وكالات الأنباء ستعرف منافسة شديدة من قبل:",["الفضائيات الإخبارية العالمية","الصحف المحلية","الإذاعات المحلية","المجلات"],0,"لكن الفضائيات ما زالت تعتمد على الوكالات في جزء مهم من أخبارها."],
[8,"من مشاكل الوكالات العالمية رغم ازدهارها:",["التبعية المالية للشركات الإعلامية والتجارية والاقتصادية","ضعف التمويل الحكومي","قلة المراسلين","قلة التقنيات"],0,"أما وكالات الدول الفقيرة فمعظمها حكومية."]
];

const LECT={1:"مفهوم الإعلام الدولي وتعريفه",2:"السمات وتكنولوجيا الاتصال",3:"أبعاد الإعلام الدولي",4:"التضليل والوظائف والعولمة",5:"الإذاعات الدولية وأنواعها",6:"الإذاعات الموجهة بالعربية وسوا",7:"وكالات الأنباء العالمية",8:"الوكالات العربية وتدفق الأخبار"};;;
const KEYS=Object.keys(LECT).map(Number);
const app=document.getElementById("app");
const LETTERS=["أ","ب","ج","د"];
let sel=new Set(KEYS), count="all", S=null;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}
function prep(raw){
  const [l,q,o,a,e,keep]=raw;
  if(keep) return {l,q,o:o.slice(),a,e};
  const idx=shuffle(o.map((_,i)=>i));
  return {l,q,o:idx.map(i=>o[i]),a:idx.indexOf(a),e};
}

const KEY="intl_progress_v1";
function save(){try{localStorage.setItem(KEY,JSON.stringify({sel:[...sel],count,S}));}catch(e){}}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!d) return;
    if(Array.isArray(d.sel)) sel=new Set(d.sel.filter(n=>LECT[n]));
    if(["20","40","all"].includes(d.count)) count=d.count;
    if(d.S&&Array.isArray(d.S.list)&&d.S.list.length&&d.S.i<=d.S.list.length) S=d.S;
  }catch(e){}
}

function home(){
  const pool=Q.filter(x=>sel.has(x[0])).length;
  const resume=S&&!S.done;
  app.innerHTML=`${resume?`<div class="card resume">
    <b>لديك اختبار لم يكتمل</b>
    <p class="lead">وصلت إلى السؤال ${S.i+1} من ${S.list.length}، والصحيح حتى الآن ${S.score}.</p>
    <div class="row"><button class="btn" id="cont">متابعة من حيث توقفت</button></div>
  </div>`:""}
  <div class="card">
    <h1>${resume?"أو ابدأ اختبارًا جديدًا":"اختبر نفسك قبل الميد"}</h1>
    <p class="lead">${Q.length} سؤال من الوحدات الأربع، مع تفسير لكل إجابة. الأسئلة والخيارات تُخلط في كل مرة، وتقدّمك يُحفظ تلقائيًا.</p>
    <span class="label">الأقسام</span>
    <div class="chips" id="lects">
      ${KEYS.map(n=>`<button class="chip" type="button" data-l="${n}" aria-pressed="${sel.has(n)}">${n}. ${LECT[n]}</button>`).join("")}
    </div>
    <span class="label">عدد الأسئلة</span>
    <div class="chips" id="cnt">
      ${["20","40","all"].map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${count===c}">${c==="all"?"الكل":c}</button>`).join("")}
    </div>
    <div class="row"><button class="btn${resume?" ghost":""}" id="go" ${pool?"":"disabled"}>ابدأ اختبارًا جديدًا</button></div>
    <div class="stat">متاح: ${pool} سؤال${resume?" · بدء اختبار جديد يستبدل الاختبار غير المكتمل":""}</div>
  </div>`;
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const n=+b.dataset.l;sel.has(n)?sel.delete(n):sel.add(n);save();home();});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{count=b.dataset.c;save();home();});
  document.getElementById("go").onclick=()=>start(Q.filter(x=>sel.has(x[0])),count);
  const c=document.getElementById("cont"); if(c) c.onclick=render;
  window.scrollTo(0,0);
}

function start(raws,limit){
  let list=shuffle(raws);
  if(limit!=="all") list=list.slice(0,+limit);
  S={list:list.map(prep),raws:list,i:0,score:0,wrong:[],done:false,answered:false,pick:null};
  save();
  render();
}

function render(){
  const q=S.list[S.i], n=S.list.length;
  app.innerHTML=`<div class="top"><span>السؤال ${S.i+1} من ${n} · الصحيح: ${S.score}</span><button class="link" type="button" id="menu">القائمة</button></div>
  <div class="bar"><i style="width:${(S.i/n)*100}%"></i></div>
  <div class="card">
    <span class="tag">${LECT[q.l]}</span>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.o.map((t,i)=>`<button class="opt" type="button" data-i="${i}"><span class="k">${LETTERS[i]}</span><span>${esc(t)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row" id="nav" hidden><button class="btn" id="next">${S.i+1<n?"السؤال التالي":"عرض النتيجة"}</button></div>
  </div>
  <p class="hint">تقدّمك يُحفظ تلقائيًا · اختصارات: 1–4 للاختيار، Enter للتالي</p>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  document.getElementById("next").onclick=next;
  document.getElementById("menu").onclick=home;
  if(S.answered&&S.pick!==null) paint(S.pick);
  window.scrollTo(0,0);
}

function answer(i){
  if(S.answered) return;
  const q=S.list[S.i], ok=i===q.a;
  S.answered=true; S.pick=i;
  if(ok) S.score++; else S.wrong.push({q,raw:S.raws[S.i],pick:i});
  save();
  paint(i);
  document.querySelector(".top span").textContent=`السؤال ${S.i+1} من ${S.list.length} · الصحيح: ${S.score}`;
}

function paint(i){
  const q=S.list[S.i], ok=i===q.a;
  app.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("bad");});
  document.getElementById("fb").innerHTML=`<div class="exp ${ok?"ok":"bad"}"><b>${ok?"إجابة صحيحة ✓":"إجابة خاطئة ✗ — الصحيح: "+esc(q.o[q.a])}</b>${esc(q.e)}</div>`;
  document.getElementById("nav").hidden=false;
  document.getElementById("next").focus({preventScroll:true});
}

function next(){
  if(!S.answered) return;
  S.i++; S.answered=false; S.pick=null;
  if(S.i<S.list.length){save();render();}
  else{S.done=true;save();result();}
}

function result(){
  const n=S.list.length, pct=Math.round(S.score/n*100);
  const msg=pct>=90?"ممتاز، أنت جاهز.":pct>=75?"جيد جدًا، راجع الأخطاء أدناه.":pct>=50?"مقبول، أعد الأسئلة الخاطئة.":"راجع الملخص ثم أعد المحاولة.";
  app.innerHTML=`<div class="card">
    <div class="score">${pct}%</div>
    <p class="lead">${S.score} من ${n} صحيحة. ${msg}</p>
    <div class="row">
      ${S.wrong.length?`<button class="btn" id="retry">أعد الأسئلة الخاطئة (${S.wrong.length})</button>`:""}
      <button class="btn ghost" id="again">اختبار جديد</button>
    </div>
    ${S.wrong.length?`<div class="review"><span class="label">مراجعة الأخطاء</span>${S.wrong.map(w=>`<div class="rv"><div class="rq">${esc(w.q.q)}</div><div class="ra">✓ ${esc(w.q.o[w.q.a])}</div><div class="re">${esc(w.q.e)}</div></div>`).join("")}</div>`:""}
  </div>`;
  const r=document.getElementById("retry"); if(r) r.onclick=()=>start(S.wrong.map(w=>w.raw),"all");
  document.getElementById("again").onclick=home;
  window.scrollTo(0,0);
}

document.addEventListener("keydown",e=>{
  if(!S||!app.querySelector(".opt")) return;
  if(/^[1-4]$/.test(e.key)){const b=app.querySelector(`.opt[data-i="${+e.key-1}"]`);if(b&&!b.disabled)b.click();}
  if(e.key==="Enter"&&S.answered){e.preventDefault();next();}
});

const root=document.documentElement;
document.getElementById("theme").onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("theme",root.dataset.theme);}catch(e){}
};
try{const t=localStorage.getItem("theme");if(t)root.dataset.theme=t;}catch(e){}

load();
if(S&&!S.done) render();
else if(S&&S.done) result();
else home();
</script>
</body>
</html>
